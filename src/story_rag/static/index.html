@media(max-width:900px){.chat-shell{grid-template-columns:250px minmax(0,1fr)}.chat-context{column-gap:6px}.kb-select{min-width:135px}.welcome{padding-top:22px}}
@media(max-width:760px){.history-panel{background:#17212b}.chat-shell{height:calc(100dvh - 66px);min-height:520px}.chat-header{height:76px;padding:0 14px;gap:10px}.chat-heading{margin-right:auto}.chat-heading small{font-size:8px}.chat-heading strong{max-width:36vw;font-size:14px}.chat-context{grid-template-columns:auto;row-gap:2px}.context-caption{font-size:8px}.kb-select{grid-row:auto;min-width:120px;max-width:150px;height:32px;font-size:11px}.context-count{grid-row:auto;font-size:9px}.conversation-scroll{padding:22px 18px 16px}.welcome{min-height:calc(100dvh - 260px);padding:26px 2px}.welcome h2{font-size:34px}.composer{width:calc(100% - 28px);margin-bottom:12px}.message-bubble{font-size:13px}}
@media(max-width:480px){.chat-header{padding:0 9px;gap:7px}.history-toggle{width:40px;height:40px}.chat-heading{min-width:0}.chat-heading small{letter-spacing:.1em}.chat-heading strong{max-width:32vw;font-size:12px}.context-caption{display:none}.chat-context{display:flex;flex-direction:column;align-items:flex-end}.kb-picker{min-width:124px}.kb-picker-trigger{min-height:32px;padding:0 10px 0 11px;font-size:11px}.kb-picker-menu{right:-4px;width:210px}.context-count{font-size:9px}.conversation-scroll{padding:20px 12px 12px}.welcome{min-height:calc(100dvh - 240px)}.welcome-mark{margin-top:22px}.welcome h2{font-size:31px}.welcome-translation{font-size:.52em}.composer{width:calc(100% - 20px);padding:7px 9px}.composer textarea{height:46px;min-height:46px;font-size:16px}.send-button{width:44px;height:44px}.message{margin-bottom:24px}.message-bubble{padding:14px 15px}.assistant-avatar,.user-avatar{width:25px;height:25px}}
/* Keep the history palette while grouping each session and its delete action in one outlined control. */
.session-row{align-items:center;gap:10px;margin:0 0 10px;padding:8px;border:0;border-radius:16px;background:transparent;transition:background .16s ease}
.session-item{min-height:68px;border:0;border-radius:10px;background:transparent;padding:10px 12px}
.session-row:hover{background:#24313a}
.session-row:hover .session-item{background:transparent}
.session-item.active{background:#2a3840;border-left:2px solid #d9f36a;border-radius:8px}
.session-delete{width:48px;height:48px;min-height:48px;flex:none;align-self:center;border:1px solid currentColor;border-radius:11px;background:transparent;transition:background .16s ease,border-color .16s ease,color .16s ease}
@media(max-width:760px){.session-row{gap:8px;padding:7px;border-radius:14px}.session-item{min-height:64px;padding:9px}.session-delete{width:46px;height:46px;min-height:46px}}
.source-triangle{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid #2858e8;transition:transform .18s ease}.answer-sources[open] .source-triangle{transform:rotate(90deg)}
</style>
</head>
<body>
<div class="connection-error" id="connectionError" role="alert" hidden></div>
<div class="app">
  <aside class="sidebar" aria-label="主导航">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z" fill="currentColor" stroke="none"/></svg></span><span class="brand-text">Another RAG</span></div>
    <nav class="primary-nav" aria-label="主菜单">
      <button class="nav-link" id="navKnowledge" type="button" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M3 10h18"/></svg><span>知识库广场</span></button>
      <button class="nav-link" id="navChat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 3V7a2 2 0 0 1 1-2Z"/><path d="M8 10h8M8 14h5"/></svg><span>AI 问答</span></button>
    </nav>
  </aside>
  <main class="main">
    <section id="knowledge" class="plaza" aria-label="知识库广场">
      <header class="plaza-banner"><p class="kicker">知识库广场</p><h1>Another RAG</h1><p>选择一座知识库，开始探索与提问。</p></header>
      <div class="plaza-content"><div class="plaza-title"><div><h2>你的知识库</h2><p>当前服务绑定的知识库。</p></div><span class="count" id="kbCount"></span></div><div class="plaza-grid" id="kbGrid"></div><p class="plaza-hint" id="serviceStatus" role="status" aria-live="polite">正在连接本地服务…</p></div>
    </section>
    <section id="library" class="library-view" aria-label="知识库资料" hidden>
      <header class="library-top"><button class="back-link" id="backToPlaza" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>返回知识库广场</button><div class="library-title-row"><div><p class="kicker">知识库资料</p><h1 id="libraryTitle"></h1><p id="librarySubtitle">整理资料后，开始一场有依据的对话。</p></div><button class="ask-action" id="askFromLibrary" type="button">开始提问<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></header>
      <div class="library-body"><div class="upload-panel" id="uploadPanel"><span class="upload-glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span><div class="upload-copy"><h2>导入 TXT 资料</h2><p>选择文件或拖放到此处，可一次添加多份。</p></div><button class="upload-button" id="chooseFiles" type="button">选择 TXT 文件</button><input id="fileInput" type="file" accept=".txt,text/plain" multiple hidden></div><div class="upload-status" id="uploadStatus" role="status" aria-live="polite" hidden></div><section class="documents-card" aria-labelledby="documentsTitle"><div class="documents-head"><div><h2 id="documentsTitle">资料列表</h2><p id="docCountLabel"></p></div><label class="sr-only" for="docSearch">搜索资料</label><input class="doc-search" id="docSearch" type="search" placeholder="搜索资料名称…"></div><div class="doc-list" id="docList"></div></section></div>
    </section>
    <section id="chat" aria-label="AI 问答" hidden>
      <div class="chat-shell">
        <aside class="history-panel" id="historyPanel" aria-label="历史对话">
          <div class="history-head"><div><p>AI 问答</p><h2>历史对话</h2></div><button class="mobile-close" id="closeHistory" type="button" aria-label="关闭历史对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg></button></div>
          <button class="new-chat" id="newChat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建会话</button>
          <label class="search-label" for="historySearch">搜索历史对话</label><input class="history-search" id="historySearch" type="search" placeholder="搜索会话标题…">
          <div class="session-list" id="sessionList"></div>
        </aside>
        <div class="chat-main">
          <header class="chat-header"><button class="history-toggle" id="historyToggle" type="button" aria-label="打开历史对话" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="chat-heading"><small><span class="live-dot"></span>RESEARCH WORKSPACE</small><strong id="chatTitle">新会话</strong></div><div class="chat-context"><span class="context-caption">当前知识库</span><div class="kb-picker" id="kbPicker"><button class="kb-picker-trigger" id="kbPickerTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="kbPickerMenu"><span id="kbPickerName">选择知识库</span><span class="kb-picker-chevron" aria-hidden="true"></span></button><div class="kb-picker-menu" id="kbPickerMenu" role="listbox" hidden></div></div><span class="context-count" id="chatDocCount"></span></div></header>
          <div class="conversation-scroll" id="conversationScroll"><div class="conversation" id="messages"></div></div>
          <form class="composer" id="composer"><div class="composer-entry"><textarea id="chatInput" aria-label="输入问题" placeholder="向这座知识库提问…" rows="1"></textarea><button class="send-button" type="submit" aria-label="发送问题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10 4 15l5 5M20 4v7a4 4 0 0 1-4 4H4"/></svg></button></div></form>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="history-scrim" id="historyScrim" hidden></div>
<dialog id="documentDialog" class="document-dialog"><div class="dialog-body"><div class="dialog-head"><div><p class="kicker">资料预览</p><h2 id="documentDialogTitle"></h2></div><button class="dialog-close" id="closeDocumentDialog" type="button" aria-label="关闭资料预览"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg></button></div><p id="documentDialogMeta"></p><pre class="document-preview" id="documentPreview"></pre><div class="dialog-actions"><button class="cancel" id="doneDocumentDialog" type="button">关闭</button></div></div></dialog>
<dialog id="deleteDocumentDialog" class="confirm-dialog"><div class="dialog-body"><h2>删除这份资料？</h2><p><strong id="deleteDocumentName"></strong> 将从当前知识库删除。原始 TXT 文件不受影响。</p><div class="dialog-actions"><button class="cancel" id="cancelDeleteDocument" type="button">取消</button><button class="danger" id="confirmDeleteDocument" type="button">删除资料</button></div></div></dialog>
<dialog id="deleteSessionDialog" class="confirm-dialog"><div class="dialog-body"><h2>归档这段会话？</h2><p><strong id="deleteSessionName"></strong> 将从历史列表隐藏，对话记录仍保留且不能在当前界面恢复。</p><div class="dialog-actions"><button class="cancel" id="cancelDeleteSession" type="button">取消</button><button class="danger" id="confirmDeleteSession" type="button">归档会话</button></div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
